# Serves a single-page application.
#
# The one line that matters is `try_files ... /index.html`: a SPA owns its own
# routing, so a browser refresh on /products asks nginx for a file that does not
# exist. Without the fallback that is a 404, and "it works until you refresh" is
# the classic SPA deployment bug.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. A React or Angular bundle is mostly JavaScript, and
    # gzip typically takes it to about a quarter of its size.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # --- Security headers ---------------------------------------------------
    # X-Frame-Options stops the app being framed by another site (clickjacking).
    # It is relaxed to SAMEORIGIN rather than DENY because the OIDC silent-renew
    # mechanism loads this app in a hidden same-origin iframe - DENY would break
    # token refresh, which then looks like random session expiry.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy - what the page may load and talk to.
    #
    #   connect-src   the two BFFs and Keycloak, because every API call and the OIDC token endpoint are
    #                 cross-origin from the app. One shared conf serves all four apps, so both BFFs are
    #                 listed; each app only ever uses one.
    #   frame-src     Keycloak plus 'self': OIDC silent renew runs the authorize round-trip in a hidden
    #                 iframe, which loads Keycloak and then the app's own callback page.
    #   style-src     'unsafe-inline' because Angular injects component styles as inline <style> tags at
    #                 runtime. Dropping it is possible with nonces and is not worth the build complexity
    #                 here; scripts stay locked to 'self', which is where the real risk lives.
    #
    # Origins are the DEV values, matching what the apps themselves are built with. A production build
    # would substitute real origins here the same way it substitutes them into the app config.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:6001 http://localhost:6002; frame-src 'self' http://localhost:8080; base-uri 'self'; object-src 'none'" always;

    # --- Caching ------------------------------------------------------------
    # Hashed assets (app-A1B2C3.js) are immutable: the filename changes whenever
    # the content does, so they can be cached for a year.
    # NGINX TRAP: an add_header inside a location block DISCARDS every add_header inherited from the
    # server block - inheritance is all-or-nothing. Any location that adds its own header must restate
    # the security set, or its responses silently ship without them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must NEVER be cached. It is the file that points at the hashed
    # assets, so a stale copy pins users to an old release indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Restated because of the inheritance trap above - and this is the response where CSP matters
        # most, since index.html IS the document the policy governs.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:6001 http://localhost:6002; frame-src 'self' http://localhost:8080; base-uri 'self'; object-src 'none'" always;
        expires 0;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
