<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reference .NET microservices platform - React storefront" />
    <!-- Tells the browser both palettes exist, so native form controls and
         scrollbars follow the theme instead of staying stubbornly light. -->
    <meta name="color-scheme" content="light dark" />
    <title>Back office</title>
  </head>
  <body>
    <!-- Runtime configuration. MUST load before the bundle: it defines window.__ECOMMERCE_CONFIG__,
         which the app reads at module scope. Regenerated from environment variables when the container
         starts, so one image serves every environment (docs/adr/0023). -->
    <script src="/config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
