# =============================================================================
#  Documentation site — build and deploy to GitHub Pages
# =============================================================================
#  Publishes docs/ as a searchable site at
#  https://rakshins10.github.io/E-Commerce/
#
#  Runs on every push to main that touches documentation, and can be triggered
#  by hand. On pull requests it builds but does NOT deploy, so a broken docs
#  build is caught in review rather than after merge.
#
#  ONE-TIME SETUP REQUIRED: in the repository, go to
#  Settings -> Pages -> Build and deployment -> Source, and choose
#  "GitHub Actions". Without that, the deploy step fails with a 404.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the git-revision-date plugin can show when a page
          # was last genuinely changed, rather than when it was last checked out.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        # Version pinned in docs/requirements.txt so a floating dependency
        # cannot break the docs build on a day nothing here changed.
        run: pip install -r docs/requirements.txt

      - name: Build
        # Not --strict: several pages link to source files outside docs/ (for
        # example ../src/building-blocks/...). Those links are correct on GitHub
        # and are the ones a reader actually wants; failing the site build over
        # them would mean weakening the docs to satisfy the tool.
        run: mkdocs build --verbose

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
