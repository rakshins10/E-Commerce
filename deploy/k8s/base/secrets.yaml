# The back office is the one service that reads other services' databases directly, and it is a
# deliberate, documented exception (docs/services/back-office.md): it is a reporting surface, its access
# is READ ONLY, and the alternative was a fan-out of synchronous calls per dashboard tile. Least
# privilege is a rule you get to break knowingly, in writing.
---
apiVersion: v1
kind: Secret
metadata:
  name: back-office-api-secrets
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  ConnectionStrings__BackOfficeDb: "Host=backoffice-db;Database=backoffice;Username=ecom;Password=dev_only_pg_pw"
  ConnectionStrings__InventoryReadDb: "Host=inventory-db;Database=inventory;Username=ecom;Password=dev_only_pg_pw"
  ConnectionStrings__OrderingReadDb: "Host=ordering-db;Database=ordering;Username=ecom;Password=dev_only_pg_pw"
  ConnectionStrings__SagaReadDb: "Host=saga-db;Database=saga;Username=ecom;Password=dev_only_pg_pw"
  KeycloakAdmin__ClientSecret: "dev_only_backoffice_svc_secret"

