# DEVELOPMENT FIXTURES. Every value here is prefixed `dev_only_` and is worthless outside a throwaway
# local cluster (ADR-0009). Nothing real is ever committed.
#
# ---------------------------------------------------------------------------------------------------
#  What a Kubernetes Secret is, and is NOT
# ---------------------------------------------------------------------------------------------------
#  A Secret is a ConfigMap that is base64-encoded and treated differently by tooling. Base64 is NOT
#  encryption - `kubectl get secret x -o yaml | base64 -d` reads it back, and by default Secrets are
#  stored unencrypted in etcd. What a Secret actually buys you is that it is a *separate object*, so it
#  can carry its own RBAC, be excluded from a `kubectl get all`, be mounted rather than printed, and be
#  replaced by an external store without touching a Deployment.
#
#  In production these come from Azure Key Vault through the Secrets Store CSI driver, which projects
#  real secrets into the pod at the same env-var names. The Deployments below do not change: they
#  reference `secretRef`, and what is behind it is somebody else's problem. That indirection is the
#  whole point.
#
#  `stringData` rather than `data`: Kubernetes base64-encodes it for you. Hand-encoding is how a
#  trailing newline gets into a password and produces an authentication failure nobody can explain.
#
# ---------------------------------------------------------------------------------------------------
#  Why one Secret per service instead of one big one
# ---------------------------------------------------------------------------------------------------
#  Because a connection string IS a credential, and database-per-service (ADR-0003) means nothing if
#  every pod is handed every database's password. `catalog-api` can reach the catalog database and
#  nothing else - the same least-privilege argument the authorization model makes for permissions.
#
#  The exception is `platform-secrets`: every service talks to the broker, so every service gets the
#  broker credential.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  EventBus__UserName: "ecom"
  EventBus__Password: "dev_only_rabbit_pw"

# --- One per service: its own database, and nothing else -------------------------------------------
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  ConnectionStrings__CatalogDb: "Host=catalog-db;Database=catalog;Username=ecom;Password=dev_only_pg_pw"

