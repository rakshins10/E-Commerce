# The four browser applications: two storefronts, two back offices, React and Angular in lockstep.
#
# Each is nginx serving a directory of static files, so they are the cheapest workloads here - 10
# millicores and 32MiB - and the most sensitive to configuration, because a browser cannot be told
# anything after the fact.
---
# React storefront.
apiVersion: v1
kind: Service
metadata:
  name: react-store
  labels:
    app.kubernetes.io/name: react-store
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app.kubernetes.io/name: react-store
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-store
  labels:
    app.kubernetes.io/name: react-store
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: react-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: react-store
        app.kubernetes.io/part-of: ecommerce
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/rakshins10/e-commerce-react-store:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # THE REASON PHASE 12 STARTED WITH ADR-0023.
            #
            # These two values are why one image can serve localhost, this cluster and Azure. The
            # container's entrypoint renders them into config.js (where the app SENDS requests) and
            # into the nginx Content-Security-Policy (where the browser is ALLOWED to send them)
            # before nginx accepts a connection. Omit either and the container refuses to start.
            #
            # They are the addresses as the BROWSER sees them. "storefront-bff:8080" is meaningless
            # here: this code runs on the user's machine, which has never heard of cluster DNS.
            - name: BFF_BASE_URL
              value: "http://api.localtest.me"
            - name: KEYCLOAK_AUTHORITY
              value: "http://auth.localtest.me/realms/ecommerce"
          # nginx serving static files needs no startupProbe: it is listening in milliseconds, and
          # readiness alone covers it. Not every workload needs all three probes - copying them in
          # without asking is how a manifest becomes cargo cult.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Same drain pause as the services, and it matters just as much here: this is the pod
              # serving the HTML, so a request lost during a deploy is a blank page rather than a
              # failed background call.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # THREE CAPABILITIES BACK, and this was found by running it rather than by reading.
              #
              # `drop: ["ALL"]` alone makes nginx die at startup with
              #     chown("/var/cache/nginx/client_temp", 101) failed (1: Operation not permitted)
              # which is a confusing message, because the container IS root. Being root means nothing
              # once the capability that implements chown has been dropped - root is a set of
              # capabilities, not a magic flag, and this is the clearest demonstration of that you will
              # get. The master process needs CHOWN for its cache directories and SETUID/SETGID to drop
              # its workers to the unprivileged nginx user.
              #
              # NET_BIND_SERVICE is deliberately NOT here: it is only needed to bind a port below 1024,
              # and this image listens on 8080 for exactly that reason.
              add: ["CHOWN", "SETGID", "SETUID"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
