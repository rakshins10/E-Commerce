    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 is the setting that makes a deploy invisible to users. It means "never drop
      # below the desired replica count", so a new pod must be READY before an old one is removed.
      # maxSurge: 1 allows one extra pod during the roll, which is what pays for that guarantee.
      #
