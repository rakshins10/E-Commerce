              command: ["pg_isready", "-U", "ecom"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ecom"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  # A volumeClaimTemplate is the difference between a StatefulSet and a Deployment that happens to
  # mount a volume: each pod gets its OWN PersistentVolumeClaim, named after it, and that claim
  # SURVIVES the pod. Delete the StatefulSet and the data is still there; delete the PVC and it is
  # gone. `kubectl delete pvc -l app.kubernetes.io/part-of=ecommerce` is this stack's
  # `docker compose down -v`.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
