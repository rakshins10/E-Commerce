# Credentials for the stateful backing services, kept beside the workloads that consume them.
#
# These live HERE rather than in base/secrets.yaml because the Azure overlay does not include this
# directory at all: managed PostgreSQL, a managed broker and Azure Cache for Redis bring their own
# credentials, delivered from Key Vault. Shipping an unused "dev_only_pg_pw" to a cloud environment
# would be untidy at best and, at worst, exactly the kind of thing that gets copied by accident.
#
# Every value is a DEVELOPMENT FIXTURE (ADR-0009).
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "ecom"
  POSTGRES_PASSWORD: "dev_only_pg_pw"

---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "ecom"
  RABBITMQ_DEFAULT_PASS: "dev_only_rabbit_pw"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  REDIS_PASSWORD: "dev_only_redis_pw"
