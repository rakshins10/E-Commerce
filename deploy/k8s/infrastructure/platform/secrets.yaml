# Keycloak's own credentials: the bootstrap administrator, and its database login.
#
# Separate from infrastructure/data because identity outlives the choice of where the data lives - the
# Azure overlay keeps Keycloak and drops the in-cluster PostgreSQL, so this file travels with the
# workload rather than with the database.
#
# DEVELOPMENT FIXTURES (ADR-0009). KC_BOOTSTRAP_ADMIN_* create the initial admin ON FIRST START ONLY;
# changing them later does nothing, exactly like the realm import.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  labels:
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "dev_only_kc_admin_pw"
  KC_DB_USERNAME: "ecom"
  KC_DB_PASSWORD: "dev_only_pg_pw"
